<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" role="img" aria-labelledby="title desc">
<title id="title">Réttarvísir: from an Icelandic question to cited sources</title>
<desc id="desc">A reconstruction of saved evaluation question 5: can a consumer request repair or replacement for a defect? The selected method combines BM25 and BGE-M3 through reciprocal rank fusion and reranking. Its top sources are articles 29, 30 and 26 of the Consumer Purchases Act. The final panel quotes the first two sentences of the recorded answer, retaining the stated exception and source citations. The diagram is illustrative, not a live search, a recording, intermediate ranking data or elapsed time.</desc>
<style>text { fill: #1c332d; }
.paper { fill: #fbfcf9; stroke: #ccd7cd; }
.panel { fill: #f0f4ee; stroke: #ccd7cd; }
.muted { fill: #51665b; }
.teal { fill: #087f72; }
.gold { fill: #8b6823; }
.mark { fill: #f1ead5; stroke: #8b6823; }
.selected { fill: #dff2e9; stroke: #087f72; }
.guide { fill: none; stroke: #ccd7cd; }
.flow { fill: none; stroke: #087f72; }
.travel { fill: #087f72; }
.serif { font-family: Georgia, Times New Roman, serif; }

.scene { opacity: 0; animation: 24s step-end infinite both; }
.final-scene { opacity: 1; }
.scene-0 { animation-name: stage-0; }
.scene-1 { animation-name: stage-1; }
.scene-2 { animation-name: stage-2; }
.scene-3 { animation-name: stage-3; }
@keyframes stage-0 { 0%, 16.666%, 100% { opacity: 1; } 16.667%, 99.999% { opacity: 0; } }
@keyframes stage-1 { 0%, 16.666%, 37.5%, 100% { opacity: 0; } 16.667%, 37.499% { opacity: 1; } }
@keyframes stage-2 { 0%, 37.499%, 58.334%, 100% { opacity: 0; } 37.5%, 58.333% { opacity: 1; } }
@keyframes stage-3 { 0%, 58.333%, 100% { opacity: 0; } 58.334%, 99.999% { opacity: 1; } }
.travel { offset-rotate: 0deg; animation: trace 2.4s linear infinite; }
.travel-left { offset-path: path('M320 158 L320 178 L170 178 L170 197'); }
.travel-right { offset-path: path('M320 158 L320 178 L470 178 L470 197'); }
@keyframes trace { 0% { offset-distance: 0%; opacity: 0; } 12% { opacity: 1; } 85% { opacity: 1; } 100% { offset-distance: 100%; opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .scene { animation: none; opacity: 0; }
  .scene.final-scene { opacity: 1; }
  .travel { animation: none; display: none; }
}
</style>
<rect x="0.5" y="0.5" width="639" height="409" rx="10" class="paper"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<rect x="28" y="20" width="31" height="30" rx="3" class="mark"/>
<text x="43.5" y="43" font-size="25" text-anchor="middle" class="gold serif">§</text>
<text x="71" y="44" font-size="28" text-anchor="start" class="serif">Réttarvísir</text>
<text x="612" y="43" font-size="21" text-anchor="end" class="muted">Saved example</text>
<path class="guide" d="M28 65 H612 M28 350 H612"/>
<g class="scene scene-0" data-stage="1">
<text x="28" y="97" font-size="19" text-anchor="start" class="muted">SPURNING</text>
<text x="320" y="157" font-size="31" text-anchor="middle" class="serif">Getur neytandi krafist úrbóta</text>
<text x="320" y="198" font-size="31" text-anchor="middle" class="serif">eða nýrrar afhendingar vegna galla?</text>
<text x="320" y="264" font-size="24" text-anchor="middle" class="muted">A question from the evaluation set.</text>
<text x="28" y="383" font-size="23" text-anchor="start" class="muted">01 / Ask in Icelandic</text>
<rect x="516" y="369" width="15" height="5" rx="2" class="teal"/>
<rect x="539" y="369" width="15" height="5" rx="2" class="panel"/>
<rect x="562" y="369" width="15" height="5" rx="2" class="panel"/>
<rect x="585" y="369" width="15" height="5" rx="2" class="panel"/>
</g>
<g class="scene scene-1" data-stage="2">
<text x="320" y="102" font-size="26" text-anchor="middle" class="serif">Getur neytandi krafist úrbóta</text>
<text x="320" y="143" font-size="26" text-anchor="middle" class="serif">eða nýrrar afhendingar vegna galla?</text>
<path class="flow" stroke-width="1.5" d="M320 158 V178 H170 V197 M320 178 H470 V197"/>
<rect x="55" y="197" width="230" height="53" rx="6" class="panel"/>
<rect x="355" y="197" width="230" height="53" rx="6" class="panel"/>
<text x="170" y="232" font-size="27" text-anchor="middle" class="">BM25</text>
<text x="470" y="232" font-size="27" text-anchor="middle" class="">BGE-M3</text>
<path class="flow" stroke-width="1.5" d="M170 250 V270 H320 V290 M470 250 V270 H320"/>
<text x="320" y="318" font-size="27" text-anchor="middle" class="teal">RRF → rerank</text>
<circle class="travel travel-left" r="4"/><circle class="travel travel-right" r="4"/>
<text x="28" y="383" font-size="23" text-anchor="start" class="muted">02 / Retrieve and rerank</text>
<rect x="516" y="369" width="15" height="5" rx="2" class="teal"/>
<rect x="539" y="369" width="15" height="5" rx="2" class="teal"/>
<rect x="562" y="369" width="15" height="5" rx="2" class="panel"/>
<rect x="585" y="369" width="15" height="5" rx="2" class="panel"/>
</g>
<g class="scene scene-2" data-stage="3">
<text x="28" y="103" font-size="28" text-anchor="start" class="serif">Lög um neytendakaup</text>
<text x="612" y="103" font-size="21" text-anchor="end" class="muted">48/2003</text>
<rect x="28" y="126" width="584" height="52" rx="6" class="selected"/>
<text x="44" y="160" font-size="24" text-anchor="start" class="gold">[1]</text>
<text x="90" y="160" font-size="25" text-anchor="start" class="serif">29. gr.</text>
<text x="185" y="160" font-size="24" text-anchor="start" class="">Úrbætur og ný afhending</text>
<rect x="28" y="188" width="584" height="52" rx="6" class="panel"/>
<text x="44" y="222" font-size="24" text-anchor="start" class="gold">[2]</text>
<text x="90" y="222" font-size="25" text-anchor="start" class="serif">30. gr.</text>
<text x="185" y="222" font-size="24" text-anchor="start" class="">Framkvæmd úrbóta</text>
<rect x="28" y="250" width="584" height="52" rx="6" class="panel"/>
<text x="44" y="284" font-size="24" text-anchor="start" class="gold">[3]</text>
<text x="90" y="284" font-size="25" text-anchor="start" class="serif">26. gr.</text>
<text x="185" y="284" font-size="24" text-anchor="start" class="">Úrræði vegna galla</text>
<text x="28" y="329" font-size="22" text-anchor="start" class="muted">Top three sources from the saved run.</text>
<text x="28" y="383" font-size="23" text-anchor="start" class="muted">03 / Read the sources</text>
<rect x="516" y="369" width="15" height="5" rx="2" class="teal"/>
<rect x="539" y="369" width="15" height="5" rx="2" class="teal"/>
<rect x="562" y="369" width="15" height="5" rx="2" class="teal"/>
<rect x="585" y="369" width="15" height="5" rx="2" class="panel"/>
</g>
<g class="scene scene-3 final-scene" data-stage="4">
<text x="28" y="102" font-size="19" text-anchor="start" class="muted">SVAR (ÚTDRÁTTUR)</text>
<text x="28" y="136" font-size="23">Já, neytandi getur valið á milli þess að krefja</text>
<text x="28" y="165" font-size="23">seljanda um úrbætur á galla á eigin reikning</text>
<text x="28" y="194" font-size="23">seljanda eða krefjast nýrrar afhendingar <tspan class="gold">[1]</tspan><tspan class="gold">[3]</tspan>.</text>
<text x="28" y="223" font-size="23">Þessi réttur á þó ekki við ef fyrir hendi er</text>
<text x="28" y="252" font-size="23">hindrun sem seljandi ræður ekki við eða ef krafan</text>
<text x="28" y="281" font-size="23">veldur seljanda ósanngjörnum kostnaði <tspan class="gold">[1]</tspan>.</text>
<rect x="28" y="313" width="170" height="28" rx="4" class="mark"/>
<text x="113" y="334" font-size="20" text-anchor="middle" class="gold">[1] 29. gr.</text>
<rect x="212" y="313" width="170" height="28" rx="4" class="mark"/>
<text x="297" y="334" font-size="20" text-anchor="middle" class="gold">[3] 26. gr.</text>
<text x="28" y="383" font-size="23" text-anchor="start" class="muted">04 / Answer with citations</text>
<rect x="516" y="369" width="15" height="5" rx="2" class="teal"/>
<rect x="539" y="369" width="15" height="5" rx="2" class="teal"/>
<rect x="562" y="369" width="15" height="5" rx="2" class="teal"/>
<rect x="585" y="369" width="15" height="5" rx="2" class="teal"/>
</g>
</g>
</svg>
