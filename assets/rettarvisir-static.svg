<text x="43.5" y="43" font-size="25" text-anchor="middle" class="gold serif">§</text>
<text x="71" y="44" font-size="28" text-anchor="start" class="serif">Réttarvísir</text>
<text x="612" y="43" font-size="21" text-anchor="end" class="muted">Saved example</text>
<path class="guide" d="M28 65 H612 M28 350 H612"/>
<g class="scene scene-3 final-scene" data-stage="4">
<text x="28" y="102" font-size="19" text-anchor="start" class="muted">SVAR (ÚTDRÁTTUR)</text>
<text x="28" y="136" font-size="23">Já, neytandi getur valið á milli þess að krefja</text>
<text x="28" y="165" font-size="23">seljanda um úrbætur á galla á eigin reikning</text>
<text x="28" y="194" font-size="23">seljanda eða krefjast nýrrar afhendingar <tspan class="gold">[1]</tspan><tspan class="gold">[3]</tspan>.</text>
<text x="28" y="223" font-size="23">Þessi réttur á þó ekki við ef fyrir hendi er</text>
<text x="28" y="252" font-size="23">hindrun sem seljandi ræður ekki við eða ef krafan</text>
<text x="28" y="281" font-size="23">veldur seljanda ósanngjörnum kostnaði <tspan class="gold">[1]</tspan>.</text>
<rect x="28" y="313" width="170" height="28" rx="4" class="mark"/>
<text x="113" y="334" font-size="20" text-anchor="middle" class="gold">[1] 29. gr.</text>
<rect x="212" y="313" width="170" height="28" rx="4" class="mark"/>
<text x="297" y="334" font-size="20" text-anchor="middle" class="gold">[3] 26. gr.</text>
<text x="28" y="383" font-size="23" text-anchor="start" class="muted">04 / Answer with citations</text>
<rect x="516" y="369" width="15" height="5" rx="2" class="teal"/>
<rect x="539" y="369" width="15" height="5" rx="2" class="teal"/>
