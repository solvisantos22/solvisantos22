<svg xmlns="http://www.w3.org/2000/svg" width="640" height="334" viewBox="0 0 640 334" role="img" aria-labelledby="title desc">
<title id="title">A scripted Ratatoskur maths lesson</title>
<desc id="desc">Solve 2x + 3 = 11. A hint suggests subtracting 3 from both sides. The student writes 2x = 8, then x = 4. An uncertain symbol is confirmed as 3 before the solution is checked: 2 times 4 plus 3 equals 11. This is a fixed illustration based on the prototype, not an app recording. The 18-second loop repeats; collapse the surrounding section to hide it.</desc>
<style>.paper { fill: #fffcf6; stroke: #d9d1c5; }
text { fill: #3c1d11; }
.muted { fill: #785e47; }
.accent { fill: #9b521f; }
.highlight { fill: #f2d6aa; }
.guide { stroke: #e7dccb; }
.good { fill: #285944; }
.math { font-family: Georgia, Times New Roman, serif; }
.accent { stroke: none; }

.lesson-stage { opacity: 0; animation: 18s step-end infinite both; }
.final-stage { opacity: 1; }
.stage-0 { animation-name: lesson-0; }
@keyframes lesson-0 { 0%, 19.999%, 100% { opacity: 1; } 20%, 99.999% { opacity: 0; } }
.stage-1 { animation-name: lesson-1; }
@keyframes lesson-1 { 0%, 19.999%, 40%, 100% { opacity: 0; } 20%, 39.999% { opacity: 1; } }
.stage-2 { animation-name: lesson-2; }
@keyframes lesson-2 { 0%, 39.999%, 60%, 100% { opacity: 0; } 40%, 59.999% { opacity: 1; } }
.stage-3 { animation-name: lesson-3; }
@keyframes lesson-3 { 0%, 59.999%, 80%, 100% { opacity: 0; } 60%, 79.999% { opacity: 1; } }
.stage-4 { animation-name: lesson-4; }
@keyframes lesson-4 { 0%, 79.999%, 100% { opacity: 0; } 80%, 99.999% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .lesson-stage { animation: none; opacity: 0; } .lesson-stage.final-stage { opacity: 1; } }
</style>
<rect class="paper" x=".5" y=".5" width="639" height="333" rx="10"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<text x="28" y="40" font-size="23" text-anchor="start" class="">Ratatoskur</text>
<text x="612" y="40" font-size="21" text-anchor="end" class="muted">Guided example</text>
<path class="guide" d="M 28 59 H 612 M 28 275 H 612" fill="none"/>
<g class="lesson-stage stage-0" data-step="1">
<text x="320" y="153" font-size="58" text-anchor="middle" class="math">2x + 3 = 11</text>
<text x="320" y="216" font-size="28" text-anchor="middle" class="muted">Find x.</text>
<text x="28" y="307" font-size="23" text-anchor="start" class="muted">01 / Write the problem</text>
<rect x="494" y="293" width="14" height="5" rx="2" class="accent"/>
<rect x="516" y="293" width="14" height="5" rx="2" class="highlight"/>
<rect x="538" y="293" width="14" height="5" rx="2" class="highlight"/>
<rect x="560" y="293" width="14" height="5" rx="2" class="highlight"/>
<rect x="582" y="293" width="14" height="5" rx="2" class="highlight"/>
</g>
<g class="lesson-stage stage-1" data-step="2">
<text x="320" y="130" font-size="53" text-anchor="middle" class="math">2x + 3 = 11</text>
<text x="320" y="196" font-size="36" text-anchor="middle" class="math accent">−3</text>
<text x="320" y="245" font-size="26" text-anchor="middle" class="muted">Subtract 3 from both sides.</text>
<text x="28" y="307" font-size="23" text-anchor="start" class="muted">02 / Ask for a hint</text>
<rect x="494" y="293" width="14" height="5" rx="2" class="accent"/>
<rect x="516" y="293" width="14" height="5" rx="2" class="accent"/>
<rect x="538" y="293" width="14" height="5" rx="2" class="highlight"/>
<rect x="560" y="293" width="14" height="5" rx="2" class="highlight"/>
<rect x="582" y="293" width="14" height="5" rx="2" class="highlight"/>
</g>
<g class="lesson-stage stage-2" data-step="3">
<text x="320" y="118" font-size="47" text-anchor="middle" class="math">2x = 8</text>
<text x="320" y="189" font-size="56" text-anchor="middle" class="math">x = 4</text>
<text x="320" y="245" font-size="26" text-anchor="middle" class="muted">Divide both sides by 2.</text>
<text x="28" y="307" font-size="23" text-anchor="start" class="muted">03 / Continue the working</text>
<rect x="494" y="293" width="14" height="5" rx="2" class="accent"/>
<rect x="516" y="293" width="14" height="5" rx="2" class="accent"/>
<rect x="538" y="293" width="14" height="5" rx="2" class="accent"/>
<rect x="560" y="293" width="14" height="5" rx="2" class="highlight"/>
<rect x="582" y="293" width="14" height="5" rx="2" class="highlight"/>
</g>
<g class="lesson-stage stage-3" data-step="4">
<text x="320" y="128" font-size="53" text-anchor="middle" class="math">2x + <tspan class="accent">?</tspan> = 11</text>
<text x="320" y="199" font-size="27" text-anchor="middle" class="accent">Is the unclear symbol a 3?</text>
<text x="320" y="244" font-size="23" text-anchor="middle" class="muted">Confirm the reading before checking.</text>
<text x="28" y="307" font-size="23" text-anchor="start" class="muted">04 / Confirm the reading</text>
<rect x="494" y="293" width="14" height="5" rx="2" class="accent"/>
<rect x="516" y="293" width="14" height="5" rx="2" class="accent"/>
<rect x="538" y="293" width="14" height="5" rx="2" class="accent"/>
<rect x="560" y="293" width="14" height="5" rx="2" class="accent"/>
<rect x="582" y="293" width="14" height="5" rx="2" class="highlight"/>
</g>
<g class="lesson-stage stage-4 final-stage" data-step="5">
<text x="320" y="106" font-size="38" text-anchor="middle" class="math muted">2x + 3 = 11</text>
<text x="320" y="155" font-size="38" text-anchor="middle" class="math muted">2x = 8</text>
<text x="320" y="211" font-size="56" text-anchor="middle" class="math">x = 4</text>
<text x="320" y="255" font-size="28" text-anchor="middle" class="math good">2 × 4 + 3 = 11</text>
<text x="28" y="307" font-size="23" text-anchor="start" class="muted">05 / Check the solution</text>
<rect x="494" y="293" width="14" height="5" rx="2" class="accent"/>
<rect x="516" y="293" width="14" height="5" rx="2" class="accent"/>
<rect x="538" y="293" width="14" height="5" rx="2" class="accent"/>
<rect x="560" y="293" width="14" height="5" rx="2" class="accent"/>
<rect x="582" y="293" width="14" height="5" rx="2" class="accent"/>
</g>
</g>
</svg>
