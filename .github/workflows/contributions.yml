name: Refresh contribution calendar

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_contributions.py'
      - 'tests/**'
      - '.github/workflows/contributions.yml'

permissions:
  contents: write

concurrency:
  group: contribution-calendar
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Check generator
        run: python3 -m unittest discover -s tests -v

      - name: Generate current calendar
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python3 scripts/generate_contributions.py --user "$PROFILE_USER"

      - name: Save refreshed images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/contributions.svg assets/contributions-dark.svg assets/contributions-static.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Refresh contribution calendar'
          git push origin HEAD:main
